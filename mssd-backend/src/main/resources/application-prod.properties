# ============================================
# Production Configuration (Render — PostgreSQL)
# ============================================

# Server - Render injects a PORT env var; fall back to 8080 for local Docker
server.port=${PORT:8080}

# Database — PostgreSQL on Render
# PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE are auto-injected from the
# Render PostgreSQL database via fromDatabase in render.yaml.
# SPRING_DATASOURCE_* can override for external databases.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mssd}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
# Override the MySQL driver from application.properties with PostgreSQL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Override the MySQL dialect from application.properties with PostgreSQL
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

# Initialize schema and data
spring.sql.init.mode=never

# File Upload
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator (for health checks and prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# CORS - update CORS_ALLOWED_ORIGINS to your frontend URL(s), comma-separated
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Cloudinary (cloud image storage — prevents file loss on Render free tier)
# Get free credentials at https://cloudinary.com
# When set, uploads go to Cloudinary; when empty, falls back to local filesystem.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Logging
logging.level.root=WARN
logging.level.com.mssd=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} -%level -%logger{60} %msg %n