# ============================================================
# Render Blueprint — MSSD (Full Stack)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. PostgreSQL  → managed database (FREE tier, 90 days)
#   2. Spring Boot → backend API (Docker, free)
#   3. Angular     → frontend served by nginx (Docker, free)
#
# How it works:
#   - You connect this repo to Render (New → Blueprint).
#   - Render reads this file, provisions the database and services.
#   - Render builds each Dockerfile automatically on every push.
#   - Database credentials are injected as env vars — no secrets in code.
#   - nginx proxies /api/* from the frontend to the backend (no CORS issues).
# ============================================================

# ── Managed PostgreSQL (free for 90 days, then $1/mo) ──────
databases:
  - name: mssd-db
    plan: free
    # region: oregon           # uncomment to pin a region

# ── Spring Boot backend (public web service) ──────────────
services:
  - type: web
    name: mssd-backend
    env: docker
    dockerfilePath: ./mssd-backend/Dockerfile
    dockerContext: ./mssd-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database connection — wired from the PostgreSQL instance above
      - key: PGHOST
        fromDatabase:
          name: mssd-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: mssd-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: mssd-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: mssd-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: mssd-db
          property: database
      # CORS — allow both Render and Vercel frontends (comma-separated)
      - key: CORS_ALLOWED_ORIGINS
        value: https://mssd-frontend.onrender.com,https://*.vercel.app,https://mssd.vercel.app
      - key: APP_UPLOAD_DIR
        value: /app/uploads
      # Cloudinary (free cloud storage — sign up at cloudinary.com)
      # Set these in the Render dashboard after first deploy:
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
    # ── Persist uploaded files across deploys (Starter+ only) ──
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

  # ── Angular Frontend (public web service) ──────────────────
  # nginx serves the built Angular app and proxies /api/* to the backend.
  - type: web
    name: mssd-frontend
    env: docker
    dockerfilePath: ./mssd-frontend/Dockerfile
    dockerContext: ./mssd-frontend
    plan: free
    healthCheckPath: /
