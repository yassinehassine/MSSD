# ============================================================
# Render Blueprint — MSSD Backend
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. PostgreSQL → managed database (FREE tier, 90 days)
#   2. Spring Boot → web service, built from GitHub repo
#
# How it works:
#   - You connect this repo to Render (New → Blueprint).
#   - Render reads this file, provisions the database and service.
#   - Render builds the Dockerfile automatically on every push.
#   - Database credentials are injected as env vars — no secrets in code.
# ============================================================

# ── Managed PostgreSQL (free for 90 days, then $1/mo) ──────
databases:
  - name: mssd-db
    plan: free
    # region: oregon           # uncomment to pin a region

# ── Spring Boot backend (public web service) ──────────────
services:
  - type: web
    name: mssd-backend
    env: docker
    dockerfilePath: ./mssd-backend/Dockerfile
    dockerContext: ./mssd-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database connection — wired from the PostgreSQL instance above
      - key: PGHOST
        fromDatabase:
          name: mssd-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: mssd-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: mssd-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: mssd-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: mssd-db
          property: database
      # CORS — change to your frontend URL after deploy
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.onrender.com
      - key: APP_UPLOAD_DIR
        value: /app/uploads
    # ── Persist uploaded files across deploys (Starter+ only) ──
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
