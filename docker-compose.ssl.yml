version: '3.8'

services:
  # ============================================
  # MySQL Database
  # ============================================
  mssd-db:
    image: mysql:8.0
    container_name: mssd-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mssd-db-data:/var/lib/mysql
      - ./mssd-backend/sql:/docker-entrypoint-initdb.d
    networks:
      - mssd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Spring Boot Backend
  # ============================================
  mssd-backend:
    build:
      context: ./mssd-backend
      dockerfile: Dockerfile
    container_name: mssd-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mssd-db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      APP_UPLOAD_DIR: /app/uploads
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - mssd-uploads:/app/uploads
      - mssd-logs:/app/logs
    depends_on:
      mssd-db:
        condition: service_healthy
    networks:
      - mssd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Nginx Reverse Proxy with SSL
  # ============================================
  mssd-nginx:
    image: nginx:1.25-alpine
    container_name: mssd-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - mssd-frontend-dist:/usr/share/nginx/html:ro
      - ./nginx-cache:/var/cache/nginx
    depends_on:
      - mssd-backend
      - mssd-frontend
    networks:
      - mssd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Angular Frontend Build
  # ============================================
  mssd-frontend:
    build:
      context: ./mssd-frontend
      dockerfile: Dockerfile
      args:
        - FRONTEND_API_BASE_URL=${FRONTEND_API_BASE_URL:-/api}
    container_name: mssd-frontend
    restart: unless-stopped
    volumes:
      - mssd-frontend-dist:/app/dist
    depends_on:
      - mssd-backend
    networks:
      - mssd-network

  # ============================================
  # phpMyAdmin (Optional - Dev/Debug)
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mssd-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mssd-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      mssd-db:
        condition: service_healthy
    networks:
      - mssd-network
    profiles:
      - debug
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # Prometheus Monitoring (Optional)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mssd-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mssd-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - mssd-backend
    networks:
      - mssd-network
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mssd-db-data:
    driver: local
  mssd-uploads:
    driver: local
  mssd-logs:
    driver: local
  mssd-frontend-dist:
    driver: local
  nginx-cache:
    driver: local
  mssd-prometheus-data:
    driver: local

networks:
  mssd-network:
    driver: bridge
